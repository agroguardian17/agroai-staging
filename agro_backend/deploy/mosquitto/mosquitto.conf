# Mosquitto 2.x configuration for AgroGuardian.
# Development listeners:
#   1883 - plain MQTT, mapped to localhost by dev compose
#   8883 - plain MQTT convenience listener, also mapped to localhost only
#
# Per-device username/password lives in /mosquitto/config/passwd (bcrypt-hashed).
# Per-device ACL lives in /mosquitto/config/acl. Both are bind-mounted by
# docker-compose.prod.yml; in dev we allow anonymous on 1883 only.

# ----- Persistence + logging --------------------------------------------
persistence true
persistence_location /mosquitto/data/
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
log_timestamp true
log_timestamp_format %Y-%m-%dT%H:%M:%S

# ----- Listener 1: plain MQTT (dev only; bound to internal docker network)
per_listener_settings true
listener 1883 0.0.0.0
protocol mqtt
allow_anonymous true

# ----- Listener 2: plain development convenience -----------------------
# Staging/production use mosquitto.prod.conf instead. Caddy terminates public
# TLS on 8883 and forwards to the authenticated internal listener on 1883.
listener 8883 0.0.0.0
protocol mqtt
allow_anonymous false
password_file /mosquitto/config/passwd
acl_file /mosquitto/config/acl

# Connection limits (room for a fleet of 50+ Main Nodes).
max_connections 1000
max_inflight_messages 100
max_queued_messages 1000
queue_qos0_messages true

# QoS 1 retained-message expiration (avoid stale telemetry surviving forever).
persistent_client_expiration 7d
