# AgroGuardian dev stack. Brings up Postgres + Mosquitto + ChromaDB + the FastAPI app
# with hot-reload mounted from ./app. Use:
#   docker compose -f docker-compose.dev.yml up -d
#
# All services are pinned to specific tags. Verify with `docker manifest inspect <tag>`
# that each tag has both linux/amd64 and linux/arm64 manifests before bumping.

name: agro-dev

services:
  postgres:
    image: postgis/postgis:15-3.4-alpine
    container_name: agro_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-agro}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      POSTGRES_DB: ${POSTGRES_DB:-agro}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-agro} -d $${POSTGRES_DB:-agro}"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [internal]

  mosquitto:
    image: eclipse-mosquitto:2.0.18
    container_name: agro_mosquitto
    restart: unless-stopped
    volumes:
      - ./deploy/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto_data:/mosquitto/data
      - mosquitto_log:/mosquitto/log
      - ./deploy/mosquitto/passwd:/mosquitto/config/passwd:ro
      - ./deploy/mosquitto/acl:/mosquitto/config/acl:ro
    ports:
      - "127.0.0.1:1883:1883"
      - "127.0.0.1:8883:8883"
    networks: [internal]

  chroma:
    image: chromadb/chroma:0.5.20
    container_name: agro_chroma
    restart: unless-stopped
    volumes:
      - chroma_data:/data
    environment:
      IS_PERSISTENT: "TRUE"
      PERSIST_DIRECTORY: "/data"
      ANONYMIZED_TELEMETRY: "FALSE"
    ports:
      - "127.0.0.1:8001:8000"
    networks: [internal]

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: agro-backend:dev
    container_name: agro_app
    restart: unless-stopped
    env_file:
      - .env
    environment:
      APP_ENV: development
      MQTT_BROKER_HOST: mosquitto
      CHROMA_HOST: chroma
      CHROMA_PORT: "8000"
    depends_on:
      postgres:
        condition: service_healthy
      mosquitto:
        condition: service_started
      chroma:
        condition: service_started
    volumes:
      - ./app:/app/app
      - ./ginger:/app/ginger
      - ./alembic:/app/alembic
      - ./rules:/app/rules
      - ./tests:/app/tests:ro
      - ./pyproject.toml:/app/pyproject.toml:ro
    ports:
      - "127.0.0.1:8000:8000"
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    networks: [internal, edge]

volumes:
  pgdata:
  mosquitto_data:
  mosquitto_log:
  chroma_data:

networks:
  internal:
    driver: bridge
  edge:
    driver: bridge
