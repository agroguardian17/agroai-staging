# Production compose for AWS Lightsail (or any Linux VPS). Coolify reads this on push to main.
# Differences vs dev:
#   - No source bind-mount; image is built and used as-is
#   - Caddy reverse-proxies all public traffic
#   - Prometheus + Grafana run Tailscale-only (Caddyfile gates by source IP)
#   - Restart policies are aggressive
#   - Every service declares a healthcheck and a memory/CPU cap (F-015)
#
# Run: docker compose -f docker-compose.prod.yml up -d --build
#
# ── Deterministic deploys / rollback (F-016) ─────────────────────────────────
# CI (.github/workflows/ci.yml) builds and pushes the app image to
#   ghcr.io/agroguardian17/agro-backend
# on every push to main/develop, tagged with an immutable `sha-<40-char-gitsha>`
# (plus a moving `:latest` on main). To deploy a known-good build without a local
# rebuild — and to roll back deterministically — set APP_IMAGE_TAG in .env to the
# immutable tag and pull instead of build:
#   APP_IMAGE_TAG=sha-<gitsha>  docker compose -f docker-compose.prod.yml pull app
#   docker compose -f docker-compose.prod.yml up -d app
# With APP_IMAGE_TAG unset the app service falls back to `:latest` (unchanged
# behaviour), and `--build` still rebuilds locally from source.
#
# ── Host memory (F-015) ──────────────────────────────────────────────────────
# The per-service `deploy.resources.limits.memory` values below are runaway
# guardrails, not extra RAM. On a small (~2 GiB) box with no swap the kernel
# OOM-killer still fires once *total* usage nears physical RAM. Add swap on the
# host (one-time, root; not done by this repo — needs an explicit VPS approval):
#   sudo fallocate -l 2G /swapfile && sudo chmod 600 /swapfile
#   sudo mkswap /swapfile && sudo swapon /swapfile
#   echo '/swapfile none swap sw 0 0' | sudo tee -a /etc/fstab

name: agro-prod

services:
  caddy:
    build:
      context: ./deploy/caddy
      dockerfile: Dockerfile
    image: agro-caddy-l4:staging
    container_name: agro_caddy
    restart: always
    cap_add: [NET_BIND_SERVICE]
    env_file:
      - .env
    environment:
      ACME_EMAIL: ${ACME_EMAIL:?ACME_EMAIL must be set in .env}
    ports:
      - "80:80"
      - "443:443"
      - "8883:8883"
    volumes:
      # Render deploy/caddy/Caddyfile.prod with `make caddyfile-prod` first.
      - ./deploy/caddy/Caddyfile.prod:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app
      - mosquitto
    healthcheck:
      # Process liveness. caddy:2.x-alpine ships busybox pgrep; the reverse proxy
      # is up iff the caddy process is running. NB: busybox `pgrep -x` matches the
      # full argv, not comm, so it is unreliable for a process launched by an
      # absolute path — use a plain substring match.
      test: ["CMD-SHELL", "pgrep caddy >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 128M
    networks: [edge, internal]

  postgres:
    image: postgis/postgis:15-3.4
    container_name: agro_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-agro}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB:-agro}"]
      interval: 10s
      timeout: 5s
      retries: 12
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 512M
    networks: [internal]

  mosquitto:
    image: eclipse-mosquitto:2.0.18
    container_name: agro_mosquitto
    restart: always
    volumes:
      - ./deploy/mosquitto/mosquitto.prod.conf:/mosquitto/config/mosquitto.conf:ro
      - ./deploy/mosquitto/passwd:/mosquitto/config/passwd:ro
      - ./deploy/mosquitto/acl:/mosquitto/config/acl:ro
      - mosquitto_data:/mosquitto/data
      - mosquitto_log:/mosquitto/log
    healthcheck:
      # Process liveness. eclipse-mosquitto ships busybox pgrep; a port/auth probe
      # would need broker credentials, so we check the broker process instead.
      # NB: the broker runs as `/usr/sbin/mosquitto ...`, and busybox `pgrep -x`
      # matches the full argv (not comm), so `-x mosquitto` never matches — use a
      # plain substring match. (Verified against the running container.)
      test: ["CMD-SHELL", "pgrep mosquitto >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 64M
    networks: [internal]

  chroma:
    image: chromadb/chroma:0.5.20
    container_name: agro_chroma
    restart: always
    volumes:
      - chroma_data:/data
    environment:
      IS_PERSISTENT: "TRUE"
      PERSIST_DIRECTORY: "/data"
      ANONYMIZED_TELEMETRY: "FALSE"
    deploy:
      resources:
        limits:
          cpus: "0.75"
          memory: 512M
    networks: [internal]

  app:
    build:
      context: .
      dockerfile: Dockerfile
    # GHCR namespace matches the repo owner (agroguardian17) so CI's GITHUB_TOKEN
    # can push here. Pin APP_IMAGE_TAG to an immutable sha-<gitsha> for
    # deterministic deploys/rollback (see header); defaults to :latest.
    image: ghcr.io/agroguardian17/agro-backend:${APP_IMAGE_TAG:-latest}
    container_name: agro_app
    restart: always
    env_file:
      - .env
    environment:
      APP_ENV: ${APP_ENV:-production}
      MQTT_BROKER_HOST: mosquitto
      CHROMA_HOST: chroma
      CHROMA_PORT: "8000"
    depends_on:
      postgres:
        condition: service_healthy
      mosquitto:
        condition: service_started
      chroma:
        condition: service_started
    healthcheck:
      # Liveness only (/health, always 200 if the process is up). We deliberately
      # do NOT gate on /ready here: /ready returns 503 when a dependency blips,
      # and using it as the container healthcheck would cause restart loops.
      test:
        ["CMD", "python", "-c",
         "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 640M
    networks: [internal]

  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: agro_prometheus
    restart: always
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256M
    networks: [internal]

  grafana:
    image: grafana/grafana:11.3.0
    container_name: agro_grafana
    restart: always
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set in .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256M
    networks: [internal]

volumes:
  pgdata:
  mosquitto_data:
  mosquitto_log:
  chroma_data:
  caddy_data:
  caddy_config:
  prometheus_data:
  grafana_data:

networks:
  internal:
    driver: bridge
  edge:
    driver: bridge
