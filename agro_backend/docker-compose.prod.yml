# Production compose for AWS Lightsail (or any Linux VPS). Coolify reads this on push to main.
# Differences vs dev:
#   - No source bind-mount; image is built and used as-is
#   - Caddy reverse-proxies all public traffic
#   - Prometheus + Grafana run Tailscale-only (Caddyfile gates by source IP)
#   - Restart policies are aggressive
#
# Run: docker compose -f docker-compose.prod.yml up -d --build

name: agro-prod

services:
  caddy:
    build:
      context: ./deploy/caddy
      dockerfile: Dockerfile
    image: agro-caddy-l4:staging
    container_name: agro_caddy
    restart: always
    cap_add: [NET_BIND_SERVICE]
    env_file:
      - .env
    environment:
      ACME_EMAIL: ${ACME_EMAIL:?ACME_EMAIL must be set in .env}
    ports:
      - "80:80"
      - "443:443"
      - "8883:8883"
    volumes:
      # Render deploy/caddy/Caddyfile.prod with `make caddyfile-prod` first.
      - ./deploy/caddy/Caddyfile.prod:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app
      - mosquitto
    networks: [edge, internal]

  postgres:
    image: postgis/postgis:15-3.4
    container_name: agro_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-agro}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB:-agro}"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks: [internal]

  mosquitto:
    image: eclipse-mosquitto:2.0.18
    container_name: agro_mosquitto
    restart: always
    volumes:
      - ./deploy/mosquitto/mosquitto.prod.conf:/mosquitto/config/mosquitto.conf:ro
      - ./deploy/mosquitto/passwd:/mosquitto/config/passwd:ro
      - ./deploy/mosquitto/acl:/mosquitto/config/acl:ro
      - mosquitto_data:/mosquitto/data
      - mosquitto_log:/mosquitto/log
    networks: [internal]

  chroma:
    image: chromadb/chroma:0.5.20
    container_name: agro_chroma
    restart: always
    volumes:
      - chroma_data:/data
    environment:
      IS_PERSISTENT: "TRUE"
      PERSIST_DIRECTORY: "/data"
      ANONYMIZED_TELEMETRY: "FALSE"
    networks: [internal]

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: ghcr.io/agroguardian/agro-backend:latest
    container_name: agro_app
    restart: always
    env_file:
      - .env
    environment:
      APP_ENV: ${APP_ENV:-production}
      MQTT_BROKER_HOST: mosquitto
      CHROMA_HOST: chroma
      CHROMA_PORT: "8000"
    depends_on:
      postgres:
        condition: service_healthy
      mosquitto:
        condition: service_started
      chroma:
        condition: service_started
    networks: [internal]

  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: agro_prometheus
    restart: always
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks: [internal]

  grafana:
    image: grafana/grafana:11.3.0
    container_name: agro_grafana
    restart: always
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set in .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
    networks: [internal]

volumes:
  pgdata:
  mosquitto_data:
  mosquitto_log:
  chroma_data:
  caddy_data:
  caddy_config:
  prometheus_data:
  grafana_data:

networks:
  internal:
    driver: bridge
  edge:
    driver: bridge
