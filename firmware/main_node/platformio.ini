; VIRAAI Main Node — PlatformIO project
;
; Target: ESP32-WROOM-32 + RA-02 LoRa RX + A7672S 4G modem + BME280 + INA219
; + DS3231 RTC + tipping-bucket rain gauge + anemometer + wind vane +
; MicroSD offline buffer.
;
; Flash + monitor: `pio run -t upload && pio device monitor -b 115200`.

[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32@^6.7.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600

build_flags =
    -DCORE_DEBUG_LEVEL=3
    -DARDUINO_LOOP_STACK_SIZE=16384

lib_deps =
    ; Radio
    sandeepmistry/LoRa @ ^0.8.0
    ; Local includes only for I2C / SD / SPI which ship with the ESP32 core.

; --- Notes ---
; * BME280, INA219 and DS3231 are driven by hand-written direct-register
;   code inside `src/main.cpp`; we do not pull in Adafruit libraries — this
;   matches the hardware team's reference implementation and avoids a stack
;   of transitive deps.
; * SD, Wire and SPI are provided by the ESP32 core and do not need to be
;   listed here.
